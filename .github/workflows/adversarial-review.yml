name: Adversarial review

# Opt-in AI review (see AGENTS.md). It runs only on same-repository pull
# requests, using the CLAUDE_CODE_OAUTH_TOKEN repository secret (Claude
# subscription, from `claude setup-token`). ANTHROPIC_API_KEY is an optional
# fallback; the subscription token is preferred when both exist.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: adversarial-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial-review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Keep Claude CLI helpers on Haiku if the reviewer launches any.
      CLAUDE_CODE_SUBAGENT_MODEL: haiku
      CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
    steps:
      - name: Report a missing credential
        if: ${{ env.HAS_OAUTH != 'true' && env.HAS_KEY != 'true' }}
        run: echo '::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; adversarial review skipped.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        with:
          node-version: 24.19.0
      # Tools come from a committed lockfile with integrity hashes, installed
      # outside the project tree. Claude Code's main package needs a postinstall
      # to place its binary, so the native linux-x64 package is locked instead.
      - name: Install locked review tools outside the project tree
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        run: |
          npm install --global --ignore-scripts npm@11.9.0
          mkdir -p "$RUNNER_TEMP/ai-review"
          cp .github/tools/ai-review/package.json .github/tools/ai-review/package-lock.json "$RUNNER_TEMP/ai-review/"
          npm ci --prefix "$RUNNER_TEMP/ai-review" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/ai-review/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Fail on high-severity findings (subscription)
        if: ${{ env.HAS_OAUTH == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node "$RUNNER_TEMP/ai-review/node_modules/adversarial-review/bin/cli.js" \
            --base "origin/$BASE_REF" \
            --provider claude \
            --model haiku \
            --timeout 600 \
            --passes 2 \
            --verify \
            --fail-on high \
            --fail-on-empty
      - name: Fail on high-severity findings (API key)
        if: ${{ env.HAS_OAUTH != 'true' && env.HAS_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node "$RUNNER_TEMP/ai-review/node_modules/adversarial-review/bin/cli.js" \
            --base "origin/$BASE_REF" \
            --provider anthropic \
            --model claude-haiku-5-5 \
            --passes 2 \
            --verify \
            --fail-on high \
            --fail-on-empty
