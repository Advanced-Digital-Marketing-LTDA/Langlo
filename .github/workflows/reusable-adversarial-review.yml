name: Reusable adversarial review

# Shared by the Advanced-Digital-Marketing-LTDA repositories. Callers pass
# `secrets: inherit` (org-level CLAUDE_CODE_OAUTH_TOKEN) and set their own
# triggers and concurrency. `tools-ref` must be the same Langlo commit the
# caller pins this workflow to: it supplies the locked review-tool lockfile.
on:
  workflow_call:
    inputs:
      tools-ref:
        description: Langlo commit SHA that holds .github/tools/ai-review
        required: true
        type: string
      passes:
        required: false
        type: number
        default: 2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  adversarial-review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      CLAUDE_CODE_SUBAGENT_MODEL: haiku
      CLAUDE_CODE_SUBAGENT_MODEL_FORCE: '1'
    steps:
      - name: Require a full commit SHA for tools-ref
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
        run: |
          if ! printf '%s' "$TOOLS_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tools-ref must be a full 40-character commit SHA."
            exit 1
          fi
      - name: Report a missing credential
        if: ${{ env.HAS_OAUTH != 'true' && env.HAS_KEY != 'true' }}
        run: echo '::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; adversarial review skipped.'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        with:
          repository: Advanced-Digital-Marketing-LTDA/Langlo
          ref: ${{ inputs.tools-ref }}
          path: .langlo-tools
          sparse-checkout: .github/tools/ai-review
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        with:
          node-version: 24.19.0
      - name: Install locked review tools outside the project tree
        if: ${{ env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true' }}
        run: |
          npm install --global --ignore-scripts npm@11.9.0
          mkdir -p "$RUNNER_TEMP/ai-review"
          cp .langlo-tools/.github/tools/ai-review/package.json .langlo-tools/.github/tools/ai-review/package-lock.json "$RUNNER_TEMP/ai-review/"
          rm -rf .langlo-tools
          npm ci --prefix "$RUNNER_TEMP/ai-review" --ignore-scripts --no-audit --no-fund
          echo "$RUNNER_TEMP/ai-review/node_modules/@anthropic-ai/claude-code-linux-x64" >> "$GITHUB_PATH"
      - name: Fail on high-severity findings (subscription)
        if: ${{ env.HAS_OAUTH == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PASSES: ${{ inputs.passes }}
        run: |
          node "$RUNNER_TEMP/ai-review/node_modules/adversarial-review/bin/cli.js" \
            --base "origin/$BASE_REF" \
            --provider claude \
            --model haiku \
            --timeout 600 \
            --passes "$PASSES" \
            --verify \
            --fail-on high \
            --fail-on-empty
      - name: Fail on high-severity findings (API key)
        if: ${{ env.HAS_OAUTH != 'true' && env.HAS_KEY == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          PASSES: ${{ inputs.passes }}
        run: |
          node "$RUNNER_TEMP/ai-review/node_modules/adversarial-review/bin/cli.js" \
            --base "origin/$BASE_REF" \
            --provider anthropic \
            --model claude-haiku-5-5 \
            --passes "$PASSES" \
            --verify \
            --fail-on high \
            --fail-on-empty
