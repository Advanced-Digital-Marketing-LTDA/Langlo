name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global --ignore-scripts npm@11.9.0
      - run: npm ci --ignore-scripts
      - name: Validate curriculum bundle and ID history
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          trap 'rm -f .t004-prior-registry.json' EXIT
          previous_ref="$EVENT_BEFORE"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            previous_ref="$(git rev-parse "${PR_HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -n "$previous_ref" ]] && git cat-file -e "$previous_ref:content/curriculum-id-registry.json" 2>/dev/null; then
            git show "$previous_ref:content/curriculum-id-registry.json" > .t004-prior-registry.json
          fi
          npm run validate:curriculum
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - name: Run tests with machine-readable evidence
        run: |
          mkdir -p .ci-reports
          npm test -- --coverage --coverage.reporter=lcov --reporter=json --reporter=default --outputFile.json=.ci-reports/vitest.json
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      - run: npm run test:property
      - run: npm run build
      - run: npm run build:e2e-coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-reports-${{ github.sha }}
          path: |
            .ci-reports/playwright-test-report.html
            .ci-reports/playwright-coverage/
          if-no-files-found: ignore
          retention-days: 1
      - name: Validate non-empty Vitest evidence
        if: always()
        run: node scripts/validate-vitest-evidence.mjs .ci-reports/vitest.json
      - name: Upload Vitest report for the merge-evidence gate
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vitest-report-${{ github.sha }}
          path: .ci-reports/vitest.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Check test integrity with Overlock
        if: always()
        uses: rxova/overlock@9b3323d5dc4df767d544a72c05a156adea1dcbc6 # v0.10.4
        with:
          version: '0.10.4'
          cli-path: ${{ github.workspace }}/node_modules/overlock/dist/cli.js
          fail-on: high
          comment: 'false'
      - name: Identify changed Jest/Vitest-style unit tests
        id: changed_unit_tests
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node scripts/detect-changed-tests.mjs
          node scripts/detect-changed-tests.mjs --emit changed-tests > "$RUNNER_TEMP/testtrust-changed-tests"
          node scripts/detect-changed-tests.mjs --emit outputs >> "$GITHUB_OUTPUT"
      - name: Check out TestTrust source at the reviewed commit
        if: ${{ always() && steps.changed_unit_tests.outputs.has_tests == 'true' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: corgu1995/testtrust
          ref: 5f468c50285cab751f7756f76e4b8f305c50e2de # v0.1.9
          path: .integrity-tools/testtrust-${{ github.run_id }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check changed unit tests with TestTrust
        if: ${{ always() && steps.changed_unit_tests.outputs.has_tests == 'true' }}
        env:
          TESTTRUST_BASE_REF: ${{ steps.changed_unit_tests.outputs.base_ref }}
          TESTTRUST_EXPECTED_FILES: ${{ steps.changed_unit_tests.outputs.count }}
          TESTTRUST_DIR: ${{ github.workspace }}/.integrity-tools/testtrust-${{ github.run_id }}
        run: |
          set -euo pipefail
          trap 'rm -rf "$TESTTRUST_DIR"' EXIT
          mapfile -d '' -t changed_unit_tests < "$RUNNER_TEMP/testtrust-changed-tests"
          if ((${#changed_unit_tests[@]} != TESTTRUST_EXPECTED_FILES)); then
            echo '::error::Changed test list does not match its recorded file count'
            exit 1
          fi
          (
            cd "$TESTTRUST_DIR"
            npm ci --ignore-scripts
            npm run build
          )
          report_path="$RUNNER_TEMP/testtrust-report.json"
          stderr_path="$RUNNER_TEMP/testtrust-stderr.log"
          set +e
          node "$TESTTRUST_DIR/bin/testtrust.mjs" \
            --base "$TESTTRUST_BASE_REF" \
            --format json \
            --fail-under 60 \
            "${changed_unit_tests[@]}" > "$report_path" 2> "$stderr_path"
          cli_status=$?
          set -e
          cat "$stderr_path" >&2
          if ((cli_status != 0)); then
            echo "::error::TestTrust CLI failed with exit code $cli_status"
            exit "$cli_status"
          fi
          node scripts/validate-testtrust-report.mjs \
            "$report_path" \
            "$TESTTRUST_BASE_REF" \
            "${#changed_unit_tests[@]}" \
            "$cli_status" \
            60
          rm -rf "$TESTTRUST_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: synthetic-test-failure-${{ github.sha }}
          path: |
            .ci-reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 3

  codecov:
    needs: foundation
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Publish the shared workflow commit before publishing this caller.
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/codecov.yml@57cd741cf0f04648e3c05e503cbd4839b6ce4abe
    with:
      artifact-name: coverage
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  apkg-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned genanki wheels without build scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/apkg-venv"
          "$RUNNER_TEMP/apkg-venv/bin/pip" install --only-binary=:all: --no-deps \
            genanki==0.13.1 cached-property==2.0.1 chevron==0.14.0 frozendict==2.4.7 pyyaml==6.0.3
      - name: Run APKG generator, checker and path-safety tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/apkg-venv/bin/python" -m unittest discover -s tests -p 'test_t003_*.py' -v

  merge-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: foundation
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vitest-report-${{ github.sha }}
          path: .ci-reports
      - name: Check merge evidence without rerunning Vitest
        uses: axigatelabs/merge-evidence-gate@bee226c890ee0115ab8222c2f1c0262c176df8c2 # v0.11.0
        with:
          agents-only: 'false'
          fail-on: fail
          evidence: report
          report-path: .ci-reports/vitest.json
          report-format: vitest
          comment: 'true'
          upload-receipt: 'true'

# No production secrets, privileged PR triggers, publishing, deployment or migrations.
# Branch protection and an actual remote run remain separately verified operator gates.
