# For projects whose test suite can't run in a workflow. Set `run_tests = false` in
# .rewardguard.toml on your base branch, copy this to .github/workflows/rewardguard.yml,
# and make "rewardguard" a required status check.
#
# One job: static checks, Jev and Haiku on the diff. It never runs the branch's code,
# so it can hold the secrets. If the base config still has run_tests = true, the check
# fails instead of running tests here.
name: rewardguard

on:
  pull_request:
  push:

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@00bea39125f707474ca6d199d7e6c9ea5c907804 # filter internal documentation from content review
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      run-tests: false # must match run_tests in .rewardguard.toml
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
