# For projects whose test suite can't run in a workflow. Set `run_tests = false` in
# .rewardguard.toml on your base branch, copy this to .github/workflows/rewardguard.yml,
# and make "rewardguard" a required status check.
#
# One job: static checks, Jev and Haiku on the diff. It never runs the branch's code,
# so it can hold the secrets. If the base config still has run_tests = true, the check
# fails instead of running tests here.
name: rewardguard

on:
  pull_request:

jobs:
  rewardguard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7 # for the Claude Code CLI
        with:
          node-version: 24

      - uses: Advanced-Digital-Marketing-LTDA/reward-hacking-checker@v0.1.0
        with:
          mode: check
          tests: 'false'
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
