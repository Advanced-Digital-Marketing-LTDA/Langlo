name: rewardguard

on:
  pull_request:

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@8564b8b8ed82459a6d03420cca5cd30a7443775d # main, 2026-10-22
    permissions:
      contents: read
      pull-requests: write
    with:
      run-tests: false # must match run_tests in .rewardguard.toml
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
