name: Ratchets

# Deterministic grep gates that let skipped or focused tests, lint suppressions
# and `any` / `@ts-ignore` only go down. Free, no secrets, no installs.
# Baselines are inline numbers; the actions' `baseline-file` input is sourced as
# shell, so it is deliberately not used.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ratchets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ratchets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test ratchet (TypeScript)
        uses: motchalini-llc/test-ratchet@4a8768340fc543b13542e56441b69b5532eb98f0 # v1.0.2
        with:
          language: typescript
          paths: src tests scripts
          baseline-skip: '0'
          forbid-only: 'true'
      # test-ratchet scans only *.test.ts and *.spec.ts and misses Playwright's
      # fixme and fail markers, so this covers the *.e2e.ts and spec suites.
      - name: Skip and focus guard (Playwright and e2e tests)
        run: |
          pattern='\b(it|test|describe)(\.describe)?\.(skip|only|fixme|fail|todo)\b|\bx(it|test|describe)\b'
          if git ls-files -z -- 'tests/*.e2e.ts' 'tests/*.spec.ts' | xargs -0 -r grep -nE "$pattern"; then
            echo '::error::Skipped, focused, fixme or expected-fail e2e tests are not allowed (baseline 0).'
            exit 1
          fi
          echo 'e2e skip/focus guard: 0 found.'
      - name: Test ratchet (Python)
        uses: motchalini-llc/test-ratchet@4a8768340fc543b13542e56441b69b5532eb98f0 # v1.0.2
        with:
          language: python
          paths: tests scripts
          baseline-skip: '0'
      - name: Suppression ratchet (TypeScript)
        uses: motchalini-llc/suppress-ratchet@3e171b421498a8a41dae883841af3d6899c7a5a3 # v1.0.2
        with:
          language: typescript
          paths: src tests scripts
          baseline-suppress: '0'
      - name: Suppression ratchet (Python)
        uses: motchalini-llc/suppress-ratchet@3e171b421498a8a41dae883841af3d6899c7a5a3 # v1.0.2
        with:
          language: python
          paths: tests scripts
          baseline-suppress: '0'
      - name: Type ratchet (TypeScript)
        uses: motchalini-llc/type-ratchet@0988c85eeb214c6f640ab20d7116543362d14c89 # v1.1.3
        with:
          language: typescript
          paths: src tests scripts
          # The one counted `any` is the English word in a comment in
          # src/lib/server/content-import.ts ("any failure writes nothing").
          baseline-any: '1'
          baseline-suppress: '0'
      - name: Type ratchet (Python)
        uses: motchalini-llc/type-ratchet@0988c85eeb214c6f640ab20d7116543362d14c89 # v1.1.3
        with:
          language: python
          paths: tests scripts
          baseline-any: '0'
          baseline-suppress: '0'
